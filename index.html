<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processamento de Imagens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="leftSide">

        <div class="panel">
            <div class="panel-header">Carregamento</div>
            <div class="panel-content">
                <div class="file-field">
                    <label for="fileInput1">Imagem 1</label>
                    <input type="file" id="fileInput1" accept="image/*">
                </div>
                <div class="file-field">
                    <label for="fileInput2">Imagem 2</label>
                    <input type="file" id="fileInput2" accept="image/*">
                </div>
                <div class="load-actions">
                    <button id="loadBtn">Carregar</button>
                    <button id="saveResultBtn">Salvar Resultado</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Operações Aritméticas</div>
            <div class="panel-content">
                <div class="btn-row">
                    <button id="sumImagesBtn">Somar Imagens</button>
                    <button id="subtractImagesBtn">Subtrair Imagens</button>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Aumentar Brilho</label>
                        <input type="number" id="brightnessValue" placeholder="0 – 255" min="0" max="255" value="50">
                    </div>
                    <button id="brightenBtn">Aplicar</button>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Diminuir Brilho</label>
                        <input type="number" id="darknessValue" placeholder="0 – 255" min="0" max="255" value="50">
                    </div>
                    <button id="darkenBtn">Aplicar</button>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Multiplicar Contraste</label>
                        <input type="number" id="contrastValue" placeholder="0.1 – 5.0" min="0.1" max="5.0" step="0.1" value="1.5">
                    </div>
                    <button id="contrastBtn">Aplicar</button>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Dividir Contraste</label>
                        <input type="number" id="divideContrastValue" placeholder="0.1 – 5.0" min="0.1" max="5.0" step="0.1" value="1.5">
                    </div>
                    <button id="divideContrastBtn">Aplicar</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Combinações e Diferenças</div>
            <div class="panel-content">
                <div class="btn-row">
                    <button id="differenceBtn">Diferença</button>
                    <button id="averageBtn">Média</button>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Alpha</label>
                        <input type="number" id="blendAlphaValue" placeholder="0 – 1" min="0" max="1" step="0.1" value="0.5">
                    </div>
                    <div class="input-group">
                        <label>Beta</label>
                        <input type="number" id="blendBetaValue" placeholder="0 – 1" min="0" max="1" step="0.1" value="0.5">
                    </div>
                    <button id="blendBtn">Blend</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Transformações Básicas</div>
            <div class="panel-content">
                <div class="btn-row">
                    <button id="grayBtn">Cinza</button>
                    <button id="negativeBtn">Negativo</button>
                    <button id="equalizeBtn">Equalizar</button>
                </div>
                <div class="btn-row">
                    <button id="flipHorizontalBtn">Flip H</button>
                    <button id="flipVerticalBtn">Flip V</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Operações Binárias</div>
            <div class="panel-content">
                <div class="input-row">
                    <div class="input-group">
                        <label>Limiar</label>
                        <input type="number" id="thresholdValue" placeholder="0 – 255" min="0" max="255" value="128">
                    </div>
                    <button id="thresholdBtn">Limiarizar</button>
                </div>
                <div class="btn-row">
                    <button id="andBtn">AND</button>
                    <button id="orBtn">OR</button>
                    <button id="xorBtn">XOR</button>
                    <button id="notBtn">NOT</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Filtros Passa-Baixa</div>
            <div class="panel-content">
                <div class="btn-row">
                    <button id="maxFilterBtn">MAX</button>
                    <button id="minFilterBtn">MIN</button>
                    <button id="meanFilterBtn">MEAN</button>
                </div>
                <div class="btn-row">
                    <button id="medianFilterBtn">MEDIANA</button>
                    <button id="gaussianFilterBtn">GAUSSIANO</button>
                    <button id="smoothBtn">SUAV.</button>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Filtro Ordem (posição 1–9)</label>
                        <input type="number" id="orderPositionValue" placeholder="1 – 9" min="1" max="9" value="5">
                    </div>
                    <button id="orderFilterBtn">Aplicar</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Filtros Passa-Alta</div>
            <div class="panel-content">
                <div class="btn-row">
                    <button id="prewittBtn">Prewitt</button>
                    <button id="sobelBtn">Sobel</button>
                    <button id="laplacianBtn">Laplaciano</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Operações Morfológicas</div>
            <div class="panel-content">
                <div class="btn-row">
                    <button id="dilateBtn">Dilatação</button>
                    <button id="erodeBtn">Erosão</button>
                </div>
                <div class="btn-row">
                    <button id="openBtn">Abertura</button>
                    <button id="closeBtn">Fechamento</button>
                    <button id="contourBtn">Contorno</button>
                </div>
            </div>
        </div>

    </div>

    <div id="rightSide">
        <div id="imagesContainer">
            <div id="image1Container">
                <h3>Imagem 1</h3>
                <img id="image1" alt="Imagem 1">
            </div>
            <div id="image2Container">
                <h3>Imagem 2</h3>
                <img id="image2" alt="Imagem 2">
            </div>
        </div>
        <div id="resultContainer">
            <h3>Resultado</h3>
            <canvas id="resultCanvas"></canvas>
        </div>
        <div id="output">Carregue duas imagens para começar.</div>
    </div>

    <script src="utils.js"></script>
    <script src="aritmetica.js"></script>
    <script src="transformacoes.js"></script>
    <script src="filtros-baixa.js"></script>
    <script src="filtros-alta.js"></script>
    <script src="morfologia.js"></script>
    <script src="carregarImg.js"></script>
</body>
</html>
